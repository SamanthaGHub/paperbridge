<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>镜中嫁衣</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080606;color:#ead8c5;font-family:"Microsoft YaHei",serif;min-height:100vh;display:grid;place-items:center}
#game{width:min(900px,94vw);height:min(680px,92vh);position:relative;overflow:hidden;border:1px solid #50342d;border-radius:14px;background:radial-gradient(circle at 50% 40%,#321414,#090707 60%);box-shadow:0 0 50px #000}
.page{display:none;height:100%;padding:28px;position:relative}.page.on{display:flex;flex-direction:column}.center{align-items:center;justify-content:center;text-align:center}
h1{font-size:clamp(38px,7vw,70px);letter-spacing:12px;margin:8px;color:#e8c9ad;text-shadow:0 0 18px #8b211b}h2{letter-spacing:5px;color:#d9b99e}
p{line-height:1.9;color:#cbb8aa}.small{color:#907b73;font-size:13px;letter-spacing:3px}
button{cursor:pointer;border:1px solid #704940;background:#1d1110;color:#e5c6ac;padding:11px 24px;margin:6px;border-radius:5px;transition:.2s}
button:hover{background:#501817;border-color:#ad6b5d;transform:translateY(-1px)}
.top{display:flex;justify-content:space-between;border-bottom:1px solid #3b2724;padding-bottom:10px}.scene{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center}
.room{width:min(680px,94%);height:300px;position:relative;border:1px solid #422c28;border-radius:10px;background:linear-gradient(#161010,#0b0808)}
.obj{position:absolute;font-size:48px;cursor:pointer;transition:.2s}.obj:hover{transform:scale(1.12);filter:drop-shadow(0 0 10px #a3342c)}
.mirror{right:10%;top:16%}.door{left:9%;bottom:10%}.table{left:43%;bottom:13%}.lamp{left:47%;top:7%}.box{right:40%;bottom:14%}
#log{min-height:58px;text-align:center;color:#bba79b;margin:12px}.inv{font-size:13px;color:#bba99d}.tag{border:1px solid #44302c;padding:4px 8px;margin-left:4px}
.mframe{width:min(420px,75%);height:350px;border:12px solid #432923;border-radius:50% 50% 8px 8px;display:grid;place-items:center;background:radial-gradient(ellipse,#351919,#080707 70%);box-shadow:inset 0 0 30px #8a241c,0 0 35px #000}
.ghost{font-size:82px;animation:b 2.5s infinite}.clock{color:#d3aa90}@keyframes b{50%{transform:translateY(-5px) scale(1.03)}}
input{width:58px;height:62px;margin:4px;background:#100c0c;color:#eac7a6;border:1px solid #654038;border-radius:5px;text-align:center;font-size:30px}
.red{color:#c55247}.end{font-size:40px;letter-spacing:7px;color:#e4bea2}
</style>
</head>
<body>
<div id="game">
<section id="start" class="page on center">
<div class="small">午夜 · 旧宅 · 一面不该照的镜子</div>
<h1>镜中嫁衣</h1>
<p>有人说，子时之后不要照镜子。<br>因为镜子里的人，可能比你先看见你。</p>
<button onclick="start()">进入古宅</button>
</section>

<section id="house" class="page">
<div class="top"><span>🕯️ 古宅 · 偏厅</span><span id="inv" class="inv">空手</span></div>
<div class="scene">
<h2>旧宅偏厅</h2>
<div class="room">
<div class="obj lamp" onclick="look('lamp')">🏮</div>
<div class="obj mirror" onclick="look('mirror')">🪞</div>
<div class="obj table" onclick="look('table')">🪔</div>
<div class="obj box" onclick="look('box')">📦</div>
<div class="obj door" onclick="look('door')">🚪</div>
</div>
<div id="log">屋外没有风，屋内却有一盏灯在轻轻晃动。</div>
<div id="choices"></div>
</div>
</section>

<section id="mirrorPage" class="page center">
<div class="top"><span>🪞 镜中世界</span><span class="clock" id="clock">03:00</span></div>
<div class="scene">
<div class="mframe"><div id="ghost" class="ghost">👰🏻‍♀️</div></div>
<p id="mtext">镜子里的新娘没有眨眼。</p>
<div><button onclick="mirror('look')">仔细观察</button><button onclick="mirror('close')">闭上眼睛</button><button onclick="mirror('turn')">转身</button></div>
</div>
</section>

<section id="puzzle" class="page center">
<div class="scene">
<div class="small">供桌机关</div><h2>四位数字锁</h2>
<p>纸条写着：<br>一更听鼓，二更看灯，三更照镜，四更……不要回头。</p>
<div><input id="a" maxlength="1" inputmode="numeric"><input id="b" maxlength="1" inputmode="numeric"><input id="c" maxlength="1" inputmode="numeric"><input id="d" maxlength="1" inputmode="numeric"></div>
<button onclick="check()">转动机关</button>
<div id="plog"></div>
</div>
</section>

<section id="end" class="page center">
<div class="small">故事结束</div><div id="et" class="end"></div><p id="ep"></p>
<button onclick="location.reload()">重新开始</button>
</section>
</div>

<script>
let items=new Set(), choices=0, timer, sec=180, closed=false, turned=false;
const $=id=>document.getElementById(id);
function page(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));$(id).classList.add('on')}
function start(){page('house');}
function inv(){ $('inv').innerHTML=items.size?[...items].map(x=>'<span class="tag">'+x+'</span>').join(''):'空手' }
function log(t){$('log').innerHTML=t}
function look(x){
 if(x==='lamp')log('灯笼里没有火，却映出一个模糊的“7”。你记住了它。');
 if(x==='table'){items.add('铜钱');inv();log('供桌下找到一枚旧铜钱。背面刻着：镜中取另一半。')}
 if(x==='box')log('木盒被锁住了。锁孔像是一枚铜钱的形状。');
 if(x==='door')log(items.has('镜中铜钱')?'门缝里传来声音：“现在，可以离开了。”':'门锁着。门后似乎有人轻轻敲了三下。');
 if(x==='mirror'){
   if(!items.has('铜钱'))log('铜镜蒙着灰。镜框刻着：先寻铜钱，再问镜中人。');
   else{page('mirrorPage');runTimer()}
 }
}
function runTimer(){if(timer)return;timer=setInterval(()=>{sec--;let m=String(Math.floor(sec/60)).padStart(2,'0'),s=String(sec%60).padStart(2,'0');$('clock').textContent=m+':'+s;if(sec<=0){clearInterval(timer);end('大凶 · 镜中人','你在镜前站得太久。镜中的新娘终于笑了，她走出了镜面。')}},1000)}
function mirror(x){
 choices++;
 if(x==='look'){items.add('镜中铜钱');inv();$('mtext').textContent='她手里也有一枚铜钱。她翻过铜钱，背面刻着“7”。'}
 if(x==='close'){closed=true;$('mtext').textContent='你闭上眼。有人在耳边说：“别睁眼……我还没有准备好。”'}
 if(x==='turn'){turned=true;$('mtext').textContent='你转身，身后空无一人。但镜子里多了一个站在你背后的人。'}
 if(choices>=2){clearInterval(timer);page('puzzle')}
}
function check(){
 let code=['1','7','3','4'],v=[$('a').value,$('b').value,$('c').value,$('d').value];
 if(v.join('')===code.join('')){items.add('门钥匙');end('真结局 · 纸人归位','铜镜裂开一道细缝。镜中的新娘把钥匙递给你，纸人倒下，古宅的门终于打开。天亮了。')}
 else{
  $('plog').innerHTML='<p class="red">不对……镜子里的她摇了摇头。</p><p>提示：第一位数字来自灯笼，镜中会告诉你第二位。</p>';
  if(closed&&turned)setTimeout(()=>end('坏结局 · 回头','你听见身后有人叫你的名字。你回头了。镜中的新娘笑着向你走来。'),700);
 }
}
function end(t,p){clearInterval(timer);$('et').textContent=t;$('ep').textContent=p;page('end')}
</script>
</body>
</html>
